name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # required for OIDC

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24     # or 22 — must ship npm ≥ 11.5.1
          registry-url: 'https://registry.npmjs.org'

      # Optional but recommended while Node versions catch up
      - name: Ensure modern npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        # Do NOT set NODE_AUTH_TOKEN here
